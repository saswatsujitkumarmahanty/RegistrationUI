<div class="dash-container">
    <div class="dash-card">
    <div class="dash-header profile-header">
        <div class="profile-avatar-wrap">
            <button type="button" class="profile-avatar" (click)="triggerAvatarPicker()"
                    [disabled]="isUploadingAvatar"
                    [attr.aria-label]="displayAvatarUrl ? 'Change profile photo' : 'Add profile photo'">
                <img *ngIf="displayAvatarUrl" [src]="displayAvatarUrl" alt="Profile photo" class="avatar-image">
                <span *ngIf="!displayAvatarUrl" class="avatar-initials">{{ initials }}</span>
                <span class="avatar-edit-badge" *ngIf="!isUploadingAvatar">📷</span>
                <span class="avatar-spinner" *ngIf="isUploadingAvatar"></span>
            </button>
            <input #avatarInput type="file" accept="image/*" class="avatar-file-input" (change)="onAvatarSelected($event)">
            <div class="avatar-actions">
                <button type="button" class="avatar-link-btn" (click)="triggerAvatarPicker()" [disabled]="isUploadingAvatar">
                    {{ displayAvatarUrl ? 'Change photo' : 'Add photo' }}
                </button>
                <button type="button" class="avatar-link-btn avatar-remove-btn" *ngIf="displayAvatarUrl"
                        (click)="removeAvatarPhoto()" [disabled]="isUploadingAvatar">
                    Remove
                </button>
            </div>
            <p class="avatar-pending-note" *ngIf="hasPendingAvatarChange && !avatarError">
                Photo not saved yet — click Save Changes below.
            </p>
            <p class="avatar-error" *ngIf="avatarError">{{ avatarError }}</p>
        </div>
        <div class="header-text">
        <h2 class="dash-title">Account Settings</h2>
        <p class="dash-subtitle">Manage your personal information</p>
        </div>
    </div>
        <div *ngIf="successMessage" class="alert-success">
            {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="alert-error">
            {{ errorMessage }}
        </div>
        <form [formGroup]="accountForm" (ngSubmit)="onSubmit()" class="dash-form" novalidate>
            <div class="floating-group">
                <input type="text" formControlName="name" placeholder=" " class="form-input" id="profile-name"
                       [class.input-error]="accountForm.get('name')?.invalid && accountForm.get('name')?.touched"
                       [class.input-valid]="fieldValid">
                <label for="profile-name" class="floating-label">Your Name</label>
                <span class="field-check" *ngIf="fieldValid">✓</span>
                <span class="field-error" *ngIf="accountForm.get('name')?.invalid && accountForm.get('name')?.touched">
                    Name must be at least 2 characters.
                </span>
            </div>
            <div class="action-buttons-container" style="margin-top: 30px;">
                <button type="submit" [disabled]="isSubmitting || !hasChanges || accountForm.invalid" class="btn-primary-action" style="width: 100%;">
                    <span class="btn-spinner" *ngIf="isSubmitting"></span>
                    <span>{{ isSubmitting ? 'Saving…' : (hasChanges ? 'Save Changes' : 'No Changes to Save') }}</span>
                </button>
            </div>
        </form>
    </div>
</div>
