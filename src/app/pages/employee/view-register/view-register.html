<div class="dash-container">
    <div class="dash-card view-card">
        <div class="dash-header">
            <h2 class="dash-title">Employee Details</h2>
        </div>

        <div class="skeleton-details" *ngIf="isLoading">
            <div class="skeleton-detail-row" *ngFor="let i of [1,2,3,4,5,6]"></div>
        </div>

        <div class="empty-state error-state" *ngIf="!isLoading && loadError">
            <p>Couldn't load this employee's details.</p>
            <button class="btn-secondary-action" (click)="loadEmployee()">Try Again</button>
        </div>

        <div class="employee-details" *ngIf="!isLoading && !loadError && UserData">
            <div class="detail-row">
                <span class="detail-label">Name</span>
                <span class="detail-value fw-bold">{{UserData.name}}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Gender</span>
                <span class="detail-value">
                    <span class="gender-badge" [ngClass]="UserData.gender === 'Male' ? 'badge-male' : 'badge-female'">
                        {{UserData.gender}}
                    </span>
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Email</span>
                <span class="detail-value">
                    {{UserData.email}}
                    <button type="button" class="copy-btn" [class.copied]="copiedField === 'email'"
                            (click)="copyToClipboard('email', UserData.email)">
                        {{ copiedField === 'email' ? 'Copied!' : 'Copy' }}
                    </button>
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Phone</span>
                <span class="detail-value">
                    {{UserData.phone}}
                    <button type="button" class="copy-btn" [class.copied]="copiedField === 'phone'"
                            (click)="copyToClipboard('phone', UserData.phone)">
                        {{ copiedField === 'phone' ? 'Copied!' : 'Copy' }}
                    </button>
                </span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Age</span>
                <span class="detail-value">{{UserData.age}}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Salary</span>
                <span class="detail-value salary-text">${{UserData.salary}}</span>
            </div>
        </div>

        <div class="card-footer">
            <button class="btn-primary-action" (click)="OnClose()">Back to Directory</button>
        </div>
    </div>
</div>
