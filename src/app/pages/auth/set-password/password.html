<div class="interactive-bg">
  <div class="dash-container">
    <div class="dash-card">
      <div class="dash-header">
        <h2 class="dash-title">Set Your Password</h2>
        <p class="dash-subtitle">Enter your email and create a secure password to finalize your account.</p>
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="dash-form">
        
        <div class="floating-group">
          <input type="email" formControlName="email" placeholder=" " class="form-input" id="pass-email" />
          <label for="pass-email" class="floating-label">Email</label>
        </div>

        <div class="floating-group">
          <input type="password" formControlName="password" placeholder=" " class="form-input" id="pass-password" />
          <label for="pass-password" class="floating-label">New Password</label>
        </div>

        
        <div class="forgot-container">
          <a href="/login-password" class="forgot-link">Already have an account?</a>
        </div>

        <button 
          type="submit" 
          [disabled]="passwordForm.invalid" 
          class="btn btn-primary"
        >
          <span>Save Password & Finish</span>
        </button>

      </form>
    </div>
  </div>
</div>
