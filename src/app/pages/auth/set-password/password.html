<div class="interactive-bg">
  <div class="dash-container">
    <div class="dash-card" [class.shake]="shake">
      <div class="dash-header">
        <h2 class="dash-title">Set Your Password</h2>
        <p class="dash-subtitle">Enter your email and create a secure password to finalize your account.</p>
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="dash-form">
        <p class="form-error-banner" *ngIf="errorMessage">{{ errorMessage }}</p>

        <div class="floating-group">
          <input type="email" formControlName="email" placeholder=" " class="form-input" id="pass-email" />
          <label for="pass-email" class="floating-label">Email</label>
        </div>

        <div class="floating-group has-toggle">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder=" " class="form-input" id="pass-password" />
          <label for="pass-password" class="floating-label">New Password</label>
          <button type="button" class="pw-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? '🙈' : '👁' }}
          </button>

          <div class="pw-strength" *ngIf="password?.value">
            <div class="pw-strength-bar"
                 [class.on]="strengthScore >= 1"
                 [class.weak]="strengthScore >= 1 && strengthLabel === 'weak'"
                 [class.fair]="strengthScore >= 1 && strengthLabel === 'fair'"
                 [class.good]="strengthScore >= 1 && strengthLabel === 'good'"
                 [class.strong]="strengthScore >= 1 && strengthLabel === 'strong'"></div>
            <div class="pw-strength-bar"
                 [class.on]="strengthScore >= 2"
                 [class.weak]="strengthScore >= 2 && strengthLabel === 'weak'"
                 [class.fair]="strengthScore >= 2 && strengthLabel === 'fair'"
                 [class.good]="strengthScore >= 2 && strengthLabel === 'good'"
                 [class.strong]="strengthScore >= 2 && strengthLabel === 'strong'"></div>
            <div class="pw-strength-bar"
                 [class.on]="strengthScore >= 3"
                 [class.weak]="strengthScore >= 3 && strengthLabel === 'weak'"
                 [class.fair]="strengthScore >= 3 && strengthLabel === 'fair'"
                 [class.good]="strengthScore >= 3 && strengthLabel === 'good'"
                 [class.strong]="strengthScore >= 3 && strengthLabel === 'strong'"></div>
            <div class="pw-strength-bar"
                 [class.on]="strengthScore >= 4"
                 [class.weak]="strengthScore >= 4 && strengthLabel === 'weak'"
                 [class.fair]="strengthScore >= 4 && strengthLabel === 'fair'"
                 [class.good]="strengthScore >= 4 && strengthLabel === 'good'"
                 [class.strong]="strengthScore >= 4 && strengthLabel === 'strong'"></div>
          </div>

          <ul class="pw-checklist" *ngIf="password?.dirty || password?.touched">
            <li [class.met]="hasMinLength"><span class="dot"></span>At least 6 characters</li>
            <li [class.met]="hasUpper"><span class="dot"></span>One uppercase letter</li>
            <li [class.met]="hasLower"><span class="dot"></span>One lowercase letter</li>
            <li [class.met]="hasNumber"><span class="dot"></span>One number</li>
          </ul>
        </div>

        
        <div class="forgot-container">
          <a href="/login-password" class="forgot-link">Already have an account?</a>
        </div>

        <button 
          type="submit" 
          [disabled]="passwordForm.invalid || isSubmitting" 
          class="btn btn-primary"
        >
          <span class="btn-spinner" *ngIf="isSubmitting"></span>
          <span>{{ isSubmitting ? 'Saving…' : 'Save Password & Finish' }}</span>
        </button>

      </form>
    </div>
  </div>
</div>
