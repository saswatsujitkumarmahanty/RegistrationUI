<div class="interactive-bg">
  <div class="dash-container">
    <div class="dash-card" [class.shake]="shake">
      <div class="dash-header">
        <h2 class="dash-title">Enter Your Password</h2>
        <p class="dash-subtitle">Enter your email and create a secure password to finalize your account.</p>
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="dash-form">
        <p class="form-error-banner" *ngIf="errorMessage">{{ errorMessage }}</p>

        <div class="floating-group">
          <input type="email" formControlName="email" placeholder=" " class="form-input" id="pass-email" />
          <label for="pass-email" class="floating-label">Email Address</label>
        </div>


        <div class="floating-group has-toggle">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder=" " class="form-input" id="pass-password" />
          <label for="pass-password" class="floating-label">New Password</label>
          <button type="button" class="pw-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
          <span class="field-hint" *ngIf="passwordForm.controls['password']?.invalid">
            Use 6+ characters with an uppercase letter, a lowercase letter, and a number.
          </span>
        </div>

        
        <div class="forgot-container">
          <a href="#" class="forgot-link">Already have an account?</a>
        </div>

        <button 
          type="submit" 
          [disabled]="passwordForm.invalid || isSubmitting" 
          class="btn btn-primary"
        >
          <span class="btn-spinner" *ngIf="isSubmitting"></span>
          <span>{{ isSubmitting ? 'Saving…' : 'Save Password & Finish' }}</span>
        </button>

      </form>
    </div>
  </div>
</div>
